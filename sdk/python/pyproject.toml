[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosoc"
version = "0.1.0"
description = "NeuroSOC SDK for backends and AI agents: check session verdicts and guard agent tool calls before they run."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["neurosoc"]
