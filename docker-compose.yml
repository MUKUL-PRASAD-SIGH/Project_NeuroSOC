networks:
  neuroshield-net:
    driver: bridge
  sandbox-net:
    driver: bridge
  api-proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${API_PROXY_SUBNET:-172.30.0.0/24}

volumes:
  postgres_data:
  grafana_data:

services:
  # ─────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    networks: [neuroshield-net]
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    networks:
      - neuroshield-net
      - sandbox-net
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    networks:
      - neuroshield-net
      - sandbox-net
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuroshield}
      POSTGRES_USER: ${POSTGRES_USER:-ns_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["local-identity"]
    command: start-dev --import-realm
    networks: [neuroshield-net]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./identity/realm-export.json:/opt/keycloak/data/import/neurosoc-realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in your .env file (see .env.example)}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [neuroshield-net]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────
  # NEUROSHIELD MICROSERVICES
  # ─────────────────────────────────────────
  ingestion:
    build: ./ingestion-service
    networks: [neuroshield-net]
    ports:
      - "${INGESTION_HTTP_HOST_PORT:-8082}:8080"
      - "${INGESTION_SYSLOG_HOST_PORT:-5141}:5140/udp"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/data
    environment:
      APP_ENV: ${APP_ENV:-local}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-512}
      KAFKA_SASL_USERNAME: ${INGESTION_KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${INGESTION_KAFKA_SASL_PASSWORD:-}
      KAFKA_TOPICS_PREPROVISIONED: ${KAFKA_TOPICS_PREPROVISIONED:-false}
      KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-/etc/ssl/certs/ca-certificates.crt}
      INGESTION_MODE: ${INGESTION_MODE:-all}
      INGESTION_SOURCE_ID: ${INGESTION_SOURCE_ID:-ingestion-service}
      INGESTION_TENANT_ID: ${INGESTION_TENANT_ID:-local}
      DATA_DIR: /data/pcap
      SYSLOG_PORT: "5140"
      KAFKA_PRODUCER_RETRIES: "10"
      KAFKA_PRODUCER_DELAY: "15"
      KAFKA_SETUP_RETRIES: "10"
      KAFKA_SETUP_DELAY: "15"
    restart: unless-stopped

  feature:
    build: ./feature-service
    networks: [neuroshield-net]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/data
    environment:
      APP_ENV: ${APP_ENV:-local}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-512}
      KAFKA_SASL_USERNAME: ${FEATURE_KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${FEATURE_KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-/etc/ssl/certs/ca-certificates.crt}
      FLOW_TIMEOUT_SECONDS: "3"
    restart: unless-stopped

  inference:
    build: ./inference-service
    # Import once before starting Uvicorn; the string target reimports main.py and duplicates metrics.
    command: ["python", "-c", "import main, uvicorn; uvicorn.run(main.app, host=main.HOST, port=main.PORT)"]
    networks:
      neuroshield-net: {}
      sandbox-net: {}
      api-proxy-net:
        ipv4_address: ${API_PROXY_INFERENCE_IP:-172.30.0.2}
        aliases:
          - inference-proxy
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/models:ro
      - ./data:/data
    environment:
      APP_ENV: ${APP_ENV:-local}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-512}
      KAFKA_SASL_USERNAME: ${INFERENCE_KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${INFERENCE_KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-/etc/ssl/certs/ca-certificates.crt}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file (see .env.example)}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RATE_LIMIT_HASH_SECRET: ${RATE_LIMIT_HASH_SECRET:-}
      MODEL_PATH: /models
      MODEL_VERSION_FILE: ${MODEL_VERSION_FILE:-/tmp/neurosoc-colab-model-placeholder.json}
      FEATURE_COLUMNS_PATH: /data/feature_columns.txt
      SANDBOX_CONFIDENCE_THRESHOLD: "0.50"
      SANDBOX_BASE_URL: http://sandbox:8001
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/neurosoc}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-neurosoc-dashboard}
      OIDC_REQUIRED: ${OIDC_REQUIRED:-false}
      ENABLE_SIMULATION_API: ${ENABLE_SIMULATION_API:-false}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      REPORT_EMAIL: ${REPORT_EMAIL:-}
      REPORT_TIME: ${REPORT_TIME:-06:00}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5174}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-1048576}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.30.0.10,172.30.0.11}"
    restart: unless-stopped

  sandbox:
    build: ./sandbox-service
    # Import the app once before handing it to Uvicorn. `python main.py` imports it again
    # through the string target and duplicates Prometheus collectors in the default registry.
    command: ["python", "-c", "import main, uvicorn; uvicorn.run(main.app, host=main.HOST, port=main.PORT)"]
    profiles: ["phase10plus"]
    networks:
      - sandbox-net
    ports:
      - "8001:8001"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      APP_ENV: ${APP_ENV:-local}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-512}
      KAFKA_SASL_USERNAME: ${SANDBOX_KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${SANDBOX_KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-/etc/ssl/certs/ca-certificates.crt}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file (see .env.example)}
      SANDBOX_TIMEOUT_SEC: "300"
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:-}
    restart: unless-stopped

  feedback:
    build: ./feedback-service
    profiles: ["phase8plus"]
    networks: [neuroshield-net]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
    environment:
      APP_ENV: ${APP_ENV:-local}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-512}
      KAFKA_SASL_USERNAME: ${FEEDBACK_KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${FEEDBACK_KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-/etc/ssl/certs/ca-certificates.crt}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file (see .env.example)}
      POLL_INTERVAL_SECONDS: "30"
    restart: unless-stopped

  retraining:
    build:
      context: .
      dockerfile: retraining-service/Dockerfile
    profiles: ["phase8plus"]
    networks: [neuroshield-net]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./models:/models:ro
      - ./models/candidates:/models/candidates
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file (see .env.example)}
      RETRAIN_MIN_FEEDBACK_SAMPLES: "3"
      RETRAIN_INTERVAL_SECONDS: "30"
      MODEL_VERSION_FILE: /models/model_version.json
      RETRAIN_STATE_FILE: /data/retraining_state.json
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: http://localhost:8000
        VITE_ENABLE_MSW: "false"
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-neurosoc}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-neurosoc-dashboard}
        # Set OIDC_REQUIRED and VITE_OIDC_REQUIRED to "true" together (and start the
        # local-identity profile for Keycloak) to require sign-in for this run.
        VITE_OIDC_REQUIRED: ${VITE_OIDC_REQUIRED:-false}
    profiles: ["phase11plus", "demo"]
    networks:
      neuroshield-net: {}
      api-proxy-net:
        ipv4_address: ${DASHBOARD_PROXY_IP:-172.30.0.10}
    ports:
      - "3000:80"
    restart: unless-stopped

  simulation_portal:
    build:
      context: ./simulation_portal
      args:
        VITE_API_URL: http://localhost:8000
    profiles: ["demo"]
    networks:
      neuroshield-net: {}
      api-proxy-net:
        ipv4_address: ${PORTAL_PROXY_IP:-172.30.0.11}
    ports:
      - "3001:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: ["ops"]
    networks: [neuroshield-net]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["ops"]
    networks: [neuroshield-net]
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/neurosoc-dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your .env file (see .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
    restart: unless-stopped
