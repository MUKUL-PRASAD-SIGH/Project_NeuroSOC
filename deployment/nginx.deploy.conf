# Front door for the public demo, behind a Cloudflare Tunnel (see deployment/README.md).
#
# What is public:   /demo (the NovaTrust customer app), its static files, /api/v1/demo/* and
#                   /api/v1/sdk/* (site-key authenticated), and /health.
# What is private:  everything else (the analyst console, the live feed, /api/v1/universal/*, model
#                   promotion, alerts...) needs the username and password in /etc/nginx/htpasswd.
#
# Mounted over /etc/nginx/conf.d/default.conf by deployment/docker-compose.deploy.yml.

upstream neuroshield_api {
    server inference-proxy:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# cloudflared runs at this address on the proxy network and passes the visitor's real address in
# CF-Connecting-IP. Trusting it only from that one address keeps visitors from spoofing the header.
# Without this every visitor would look like one client, which would share a single rate limit and
# make the bot-farm detector link unrelated visitors by "the same IP".
set_real_ip_from 172.30.0.12;
real_ip_header CF-Connecting-IP;

# Per real visitor address.
limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Private by default. The public locations below switch this off one by one.
    auth_basic "NeuroSOC analyst console";
    auth_basic_user_file /etc/nginx/htpasswd;

    # ── public: the customer demo and its static files ──────────────────────────────────────
    location = /demo         { auth_basic off; try_files /index.html =404; }
    location /demo/          { auth_basic off; try_files /index.html =404; }
    location /assets/        { auth_basic off; try_files $uri =404; }
    location = /neurosoc.min.js { auth_basic off; try_files $uri =404; }
    location = /favicon.ico  { auth_basic off; try_files $uri =404; log_not_found off; }

    # ── public: APIs that authenticate themselves ───────────────────────────────────────────
    location = /health {
        auth_basic off;
        proxy_pass http://neuroshield_api/health;
        proxy_set_header Host $host;
    }

    # SDK routes use the application's site key; the demo routes act only on the demo's fake account.
    location /api/v1/sdk/ {
        auth_basic off;
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass http://neuroshield_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/demo/ {
        auth_basic off;
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass http://neuroshield_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── private: the analyst console and its API ────────────────────────────────────────────
    location /api/v1/universal/ws {
        proxy_pass http://neuroshield_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/v1/ws/ {
        proxy_pass http://neuroshield_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /ws/ {
        proxy_pass http://neuroshield_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://neuroshield_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The raw telemetry intake is not exposed publicly.
    location = /ingest { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
