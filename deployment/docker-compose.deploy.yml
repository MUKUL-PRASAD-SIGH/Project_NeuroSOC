# Deployment overlay for the public demo (a spare PC behind a Cloudflare Tunnel).
#
#   docker compose --env-file "$DEPLOY_HOME/.env.deploy" \
#       -f docker-compose.yml -f deployment/docker-compose.deploy.yml up -d
#
# deployment/deploy.sh does exactly that, after running the preflight checks. See deployment/README.md.
#
# What this changes compared with the development stack:
#   * No service publishes a port on the host. Redis, Kafka, Postgres, the API and the rest are reachable only
#     inside Docker; the only way in from outside is the tunnel, which talks to the dashboard's nginx.
#   * The dashboard is built for the public demo (same-origin API, SDK protection page, demo panel) and its
#     nginx is replaced by deployment/nginx.deploy.conf (real visitor IPs, rate limits, the analyst console behind a
#     password, the raw ingest endpoint closed).
#   * The inference service loads a generated seed file with fresh application keys instead of
#     sdk/sites.local.json, whose sample keys are public.
#   * cloudflared, health checks, and capped container logs are added.
#
# The demo cannot run with APP_ENV=production (the service refuses to start with demo mode there), so this
# is a hardened public demo, not a production deployment. See "What this is and is not" in deployment/README.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── nothing is published on the host ─────────────────────────────────────────────────────────
  zookeeper:
    ports: !reset []
    logging: *logging
  kafka:
    ports: !reset []
    logging: *logging
  postgres:
    ports: !reset []
    logging: *logging
  redis:
    ports: !reset []
    logging: *logging
  keycloak:
    ports: !reset []
    logging: *logging
  ingestion:
    image: neurosoc/ingestion:deploy
    ports: !reset []
    logging: *logging
  feature:
    image: neurosoc/feature:deploy
    logging: *logging
  sandbox:
    image: neurosoc/sandbox:deploy
    ports: !reset []
    logging: *logging
  feedback:
    image: neurosoc/feedback:deploy
    logging: *logging
  retraining:
    image: neurosoc/retraining:deploy
    logging: *logging
  simulation_portal:
    image: neurosoc/simulation-portal:deploy
    ports: !reset []
    logging: *logging
  prometheus:
    ports: !reset []
    logging: *logging
  grafana:
    ports: !reset []
    logging: *logging

  # ── the API ──────────────────────────────────────────────────────────────────────────────────
  inference:
    image: neurosoc/inference:deploy
    ports: !reset []
    logging: *logging
    volumes:
      # Fresh application keys for this deployment (generated by deployment/preflight.py, kept outside the repository).
      - ${DEPLOY_SECRETS_DIR:?Set DEPLOY_SECRETS_DIR (deployment/preflight.py init writes it)}/sites.json:/deploy/sites.json:ro
    environment:
      APP_ENV: local                      # demo mode refuses to start in staging/production
      ENABLE_UNIVERSAL_ENGINE: "true"
      NEUROSOC_DEMO_MODE: "true"
      ENABLE_SIMULATION_API: "false"
      UNIVERSAL_SITES_FILE: /deploy/sites.json
      NOVATRUST_DEMO_SECRET_KEY: ${NOVATRUST_DEMO_SECRET_KEY:?Set NOVATRUST_DEMO_SECRET_KEY}
      UNIVERSAL_HASH_SECRET: ${UNIVERSAL_HASH_SECRET:?Set UNIVERSAL_HASH_SECRET}
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
      OIDC_REQUIRED: "false"              # the analyst console is protected by basic auth at the edge instead
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 120s

  # ── the website ──────────────────────────────────────────────────────────────────────────────
  dashboard:
    image: neurosoc/dashboard:deploy
    ports: !reset []
    logging: *logging
    build:
      args:
        VITE_API_URL: /                    # same-origin: the browser calls /api on the page's own host
        VITE_UNIVERSAL_ENABLED: "true"
        VITE_DEMO_MODE: "true"
        VITE_OIDC_REQUIRED: "false"
    depends_on:
      inference:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.deploy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DEPLOY_SECRETS_DIR:?Set DEPLOY_SECRETS_DIR}/htpasswd:/etc/nginx/htpasswd:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/demo"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── the tunnel: the only thing that reaches the internet ─────────────────────────────────────
  # Create the tunnel in Cloudflare Zero Trust (Networks > Tunnels), copy its token into
  # CLOUDFLARE_TUNNEL_TOKEN, and point the public hostname at  http://dashboard:80  (see deployment/README.md).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN (deployment/README.md, step 3)}
    networks:
      api-proxy-net:
        # nginx trusts CF-Connecting-IP from exactly this address (deployment/nginx.deploy.conf).
        ipv4_address: ${API_PROXY_CLOUDFLARED_IP:-172.30.0.12}
    depends_on:
      dashboard:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    restart: unless-stopped
    logging: *logging
