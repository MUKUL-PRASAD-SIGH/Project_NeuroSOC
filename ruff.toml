# Correctness-only lint gate: undefined names, unused imports and variables, syntax errors.
target-version = "py311"
line-length = 140
extend-exclude = ["node_modules", "dist"]

[lint]
select = ["F", "E9"]

[lint.per-file-ignores]
# Imported for its side effect of putting retraining-service on the import path.
"tests/02_integration/test_retraining_holdout_gate.py" = ["F401"]
