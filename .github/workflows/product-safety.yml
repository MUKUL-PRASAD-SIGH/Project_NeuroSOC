name: Product safety checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mock-and-credential-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test production build guards
        run: node --test tests/test_production_build_guard.mjs
      - name: Scan production paths for known demo credentials
        run: python scripts/check_production_credential_patterns.py
