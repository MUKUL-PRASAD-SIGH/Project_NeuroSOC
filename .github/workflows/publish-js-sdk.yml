name: Publish JS SDK

# Release: bump the version in sdk/js/package.json, then push a matching tag,
# e.g. `git tag sdk-js-v0.1.1 && git push origin sdk-js-v0.1.1`.
# Uses npm trusted publishing, so no npm token is stored in the repo. The first
# version of @neurosoc/sdk is published by hand; see "Releasing" in sdk/README.md.
on:
  push:
    tags:
      - "sdk-js-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#sdk-js-v}"
          version=$(node -p "require('./package.json').version")
          echo "tag=$tag package.json=$version"
          [ "$tag" = "$version" ]
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: js-sdk-tarball
          path: sdk/js/*.tgz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@neurosoc/sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: js-sdk-tarball
      - run: npm publish ./*.tgz --access public
